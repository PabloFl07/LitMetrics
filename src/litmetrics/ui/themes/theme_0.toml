# Style variant 0 (default) · Slate Blue: mix of the others. Page colors of variant 1 a little grayer
# (dark mode stays lighter than variant 2), navigation bar of variant 1, blue accent of variant 2
# slightly muted, IBM Plex type, and the compact sizes and spacing of variant 2
# (src/litmetrics/ui/styles/styles.css).
#
# Accent scale (muted blue): 50 #EEF3FC · 100 #DCE6F9 · 200 #BBCEF3 · 300 #9CBDF2 · 400 #6E97E6
#   500 #4A7BDE · 600 #2E5FD3 · 700 #2250BE · 800 #1F4399 · 900 #1E3A78
# Light: primary 600, link 700. Dark: primary #346BD8 (white text on it stays at 4.9:1),
# link 300. Hover, focus and active tones are derived from primaryColor in
# src/litmetrics/ui/theme.py, so the accent changes here and nowhere else.
# Contrast ratios (WCAG): docs/styling.md. tests/ui/test_theme.py checks them.

[theme]
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 14
codeFontSize = "12.5px"
headingFontSizes = ["22px", "18px", "15px", "14px", "13px", "12px"]
headingFontWeights = [600, 600, 600, 500, 500, 500]
metricValueFontSize = "1.5rem"
metricValueFontWeight = 500
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true
linkUnderline = false
paddingTop = "1rem"
paddingBottom = "2rem"

[theme.light]
