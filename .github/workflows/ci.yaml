name: CI

on:
  push:
    branches: [main, dev]
  workflow_dispatch:                  # botón "Run workflow" en la pestaña Actions

# Un push nuevo a la misma rama/PR cancela la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # Los mismos hooks que en local: ruff check, ruff format, YAML/TOML, ficheros grandes...
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Unit + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked          # Python 3.14 sale de .python-version
      - run: uv run pytest -q

  acceptance:
    name: Acceptance (Playwright)
    needs: tests                      # no gasta un navegador si lo básico ya falla
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m acceptance -q --tracing retain-on-failure
      - name: Guardar trazas de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
