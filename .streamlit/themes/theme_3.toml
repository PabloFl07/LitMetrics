# Style variant 3 · Canvas Navy: BI canvas. A gray page with white cards in light mode (cards
# lighter than the page in dark mode too), blue-indigo accent, 12 px radii, KPI cards with an
# accent rule on the left (src/litmetrics/ui/styles_3.css).
#
# Here secondaryBackgroundColor is the card and widget surface, lighter than the page in both
# modes. Inputs are white on the gray canvas, as in most BI tools.
#
# Accent scale (blue-indigo): 50 #EEF1FE · 100 #DDE3FC · 200 #BCC6F9 · 300 #95A4F4
#   400 #7084EE · 500 #5266E8 · 600 #3A50D9 · 700 #2F43B8 · 800 #283893 · 900 #222F73
# Light: primary 600, link 700. Dark: primary 500 (white text on it at 4.8:1), link 300.
# Hover, focus and active tones are derived from primaryColor in src/litmetrics/ui/theme.py,
# so the accent changes here and nowhere else.
# Semantic text colors are one step darker than in variants 1 and 2: they sit on a gray page.
# Contrast ratios (WCAG): docs/styling.md. tests/ui/test_theme.py checks them.

[theme]
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 15
codeFontSize = "13px"
headingFontSizes = ["28px", "21px", "17px", "15px", "13px", "12px"]
headingFontWeights = [600, 600, 600, 600, 500, 500]
metricValueFontSize = "1.875rem"
metricValueFontWeight = 500
baseRadius = "12px"
buttonRadius = "8px"
showWidgetBorder = true
linkUnderline = false
paddingTop = "1.5rem"
paddingBottom = "3rem"

