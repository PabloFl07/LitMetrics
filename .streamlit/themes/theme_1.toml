# Style variant 1 · Indigo Slate: clean dashboard. White page, slate neutrals, indigo accent,
# 8 px radii, cards with a hairline border and a very soft shadow (src/litmetrics/ui/styles_1.css).
#
# Accent scale (indigo): 50 #EEF2FF · 100 #E0E7FF · 200 #C7D2FE · 300 #A5B4FC · 400 #818CF8
#   500 #6366F1 · 600 #4F46E5 · 700 #4338CA · 800 #3730A3 · 900 #312E81
# Light: primary 600, link 700. Dark: primary #5A5FEA (between 500 and 600: white text on it
# stays at 4.9:1), link 300. Hover, focus and active tones are derived from primaryColor in
# src/litmetrics/ui/theme.py, so the accent changes here and nowhere else.
# Contrast ratios (WCAG): docs/styling.md. tests/ui/test_theme.py checks them.

[theme]
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 14
codeFontSize = "13px"
headingFontSizes = ["26px", "20px", "16px", "14px", "13px", "12px"]
headingFontWeights = [600, 600, 600, 600, 500, 500]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 500
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
linkUnderline = false
paddingTop = "1.5rem"
paddingBottom = "3rem"

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6FA"
