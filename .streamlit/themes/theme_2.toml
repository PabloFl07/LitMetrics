# Style variant 2 · Graphite Blue: dense and flat. Neutral zinc grays, pure blue accent, 6 px
# radii, hairlines instead of shadows, 14 px text and tighter spacing
# (src/litmetrics/ui/styles/styles_2.css).
#
# Accent scale (blue): 50 #EFF6FF · 100 #DBEAFE · 200 #BFDBFE · 300 #93C5FD · 400 #60A5FA
#   500 #3B82F6 · 600 #2563EB · 700 #1D4ED8 · 800 #1E40AF · 900 #1E3A8A
# Light: primary 600, link 700. Dark: primary #2F6FEB (white text on it stays at 4.6:1; 500
# would drop to 3.7), link 300. Hover, focus and active tones are derived from primaryColor in
# src/litmetrics/ui/theme.py, so the accent changes here and nowhere else.
# Contrast ratios (WCAG): docs/styling.md. tests/ui/test_theme.py checks them.

[theme]
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 14
codeFontSize = "12.5px"
headingFontSizes = ["22px", "18px", "15px", "14px", "13px", "12px"]
headingFontWeights = [600, 600, 600, 500, 500, 500]
metricValueFontSize = "1.5rem"
metricValueFontWeight = 500
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true
linkUnderline = false
paddingTop = "1rem"
paddingBottom = "2rem"

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5F7"
codeBackgroundColor = "#F4F4F5"
textColor = "#18181B"
linkColor = "#1D4ED8"
borderColor = "#E4E4E7"
codeTextColor = "#3F3F46"
