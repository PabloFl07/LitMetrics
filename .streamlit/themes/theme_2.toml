violetBackgroundColor = "#F1EBFD"
grayColor = "#71717A"
grayTextColor = "#52525B"
grayBackgroundColor = "#F0F0F2"
chartCategoricalColors = ["#2563EB", "#0D9488", "#EA580C", "#9333EA", "#CA8A04", "#DB2777", "#71717A", "#16A34A"]
chartSequentialColors = ["#EFF6FF", "#DBEAFE", "#BFDBFE", "#93C5FD", "#60A5FA", "#3B82F6", "#2563EB", "#1D4ED8", "#1E40AF", "#1E3A8A"]
dataframeBorderColor = "#E4E4E7"
